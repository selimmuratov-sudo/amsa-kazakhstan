<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10192b"><title>{{ title }} — AMSA Kazakhstan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/portal.css">
</head>
<body>
  <div class="top"><div class="wrap"><span>AMSA Kazakhstan · безопасность аккаунта</span><a href="/">Публичный сайт</a></div></div>
  <header><nav class="nav wrap"><a class="brand" href="/"><span class="brandmark">AM</span><span>AMSA<small>MEMBER PORTAL</small></span></a></nav></header>
  <main class="auth-main"><section class="auth-wrap"><div class="eyebrow">ЗАЩИТА АККАУНТА</div><h1>Задай личный пароль</h1><p class="auth-sub">Для временного доступа нужен новый пароль. После смены ты попадёшь в личный кабинет.</p><p id="password-reset-message" class="portal-message" role="status" aria-live="polite"></p>
    <form id="password-reset-form" class="auth-form" autocomplete="on">
      <label class="field">Временный пароль<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label class="field">Новый пароль <span class="field-hint">не менее 12 символов</span><input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label>
      <label class="field">Повтори новый пароль<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label>
      <button id="password-reset-submit" class="btn" type="submit">Сохранить новый пароль ↗</button>
    </form><p class="auth-bottom"><a href="#" id="password-reset-logout">Выйти из аккаунта</a></p>
  </section></main>
  <footer class="footer"><div class="wrap"><span>© 2026 AMSA Kazakhstan</span><a href="/">На главную ↑</a></div></footer>
  <script src="/password-reset.js" defer></script>
</body>
</html>
